name: Release

on:
  push:
    branches: [main]

# One release at a time, and never cancelled. A run that is already pushing
# layers has to finish: killing it leaves a tag half-written in the registry.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Same remote cache as CI. The build runs on the runner and not inside Docker
  # precisely so this keeps working — a build in a Dockerfile has no token and
  # redoes work the cache already holds.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAMID: team_G2sXGIEvkYnFhLHzWtvo1u04
  REGISTRY: ghcr.io
  # Read at build time by apps/profile/next.config.ts, which turns it into
  # images.remotePatterns. It is in turbo.json's build env, so it is part of the
  # hash below and a change to it produces a new image.
  #
  # PROFILE_APEX is deliberately absent. Nothing prerenders any more, so it
  # changes nothing in the artifact — owners.ts reads it when the process
  # starts. Setting it here would put it in the hash and make the apex cutover
  # rebuild an image identical to the one already deployed.
  CMS_URL: https://cms.mbss.sch.id
  # Where Strapi's S3 provider serves media from. Also a build input: the
  # profile turns it into a second images.remotePatterns entry, without which
  # every photograph 500s with "hostname is not configured".
  MEDIA_BASE_URL: https://nos.jkt-1.neo.id/mbss-uploads

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Independent images. One failing should not stop the other two from
      # publishing, since the deploy in the next slice pins each by its own tag.
      fail-fast: false
      matrix:
        include:
          - app: profile
            # The task whose hash stands for "everything that goes into this
            # image". Turbo already folds in the dependency graph and the `env`
            # list, which is why this is used instead of path filters: a change
            # to packages/ui moves this hash, and a path filter on apps/profile
            # would not see it.
            task: build
          - app: cms
            task: build
          - app: api
            # The API has no build task — Node runs its TypeScript directly —
            # so typecheck stands in. It hashes the same things: the package's
            # own files and its dependencies.
            task: typecheck

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Work out the image tag
        id: tag
        run: |
          set -euo pipefail
          tag=$(infra/image-tag.sh ${{ matrix.app }} ${{ matrix.task }})
          echo "image=$REGISTRY/${{ github.repository_owner }}/mbs-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag for mbs-${{ matrix.app }}: $tag"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this image already published?
        id: exists
        run: |
          if docker manifest inspect \
            "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1
          then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Already published; nothing to build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Both remaining steps are skipped when the tag exists, which is the
      # whole point: an unrelated merge republishes nothing.
      - name: Build the application
        if: steps.exists.outputs.found == 'false' && matrix.task == 'build'
        run: pnpm exec turbo run build --filter=@mbs/${{ matrix.app }}

      - name: Build and push the image
        if: steps.exists.outputs.found == 'false'
        run: |
          set -euo pipefail
          # Tagged twice: the content hash is what a deploy pins and what the
          # skip above matches, and the commit SHA records which commit first
          # produced this image. Note it only appears on commits that actually
          # changed the image — a merge that touches nothing here adds no SHA
          # tag, so the SHA tags are a partial history, not a per-commit one.
          # What a deploy pins and reports is the content hash, which is
          # reproducible from any checkout.
          docker build \
            -f apps/${{ matrix.app }}/Dockerfile \
            -t "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" \
            -t "${{ steps.tag.outputs.image }}:sha-${{ github.sha }}" \
            .
          docker push --all-tags "${{ steps.tag.outputs.image }}"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    env:
      # Not a secret — slice 0 of the deployment plan names it, and `root` is
      # refused by the box anyway. Only the address, the private key and the
      # host key are secrets.
      VPS_USER: admin-mbss
    # Deliberately not in branch protection's required checks. Those six gate a
    # merge; this runs after one, and requiring a context that only appears
    # post-merge blocks every pull request on the repository.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Work out the tags to deploy
        id: tags
        # Recomputed rather than carried over from the matrix above: matrix legs
        # cannot aggregate job outputs without an artifact, and the computation
        # is deterministic — the same script on the same commit gives the same
        # answer, which is why it lives in one file both jobs call.
        run: |
          set -euo pipefail
          echo "profile=$(infra/image-tag.sh profile build)" >> "$GITHUB_OUTPUT"
          echo "cms=$(infra/image-tag.sh cms build)" >> "$GITHUB_OUTPUT"
          echo "api=$(infra/image-tag.sh api typecheck)" >> "$GITHUB_OUTPUT"

      - name: Open an SSH connection
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned rather than accepted blindly: StrictHostKeyChecking=no would
          # make a swapped host key invisible, and this connection carries the
          # command that replaces the running site.
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Send the files the box runs from
        # compose.prod.yml, the Caddyfile, the init script and deploy.sh live in
        # Git, not in any image, so the box needs this commit's copies before it
        # runs them. /opt/mbs/.env is never touched: it holds every secret and
        # nothing in CI knows its contents.
        run: |
          set -euo pipefail
          # install-host.sh and generate-secrets.sh are deliberately absent: both
          # have to run before the first deploy ever happens, so they arrive
          # with a clone or an scp, not with this.
          tar -cz -C infra \
            compose.prod.yml Caddyfile postgres \
            deploy.sh backup.sh restore-drill.sh install-backup-cron.sh \
            | ssh -o BatchMode=yes "$VPS_USER@${{ secrets.VPS_HOST }}" \
              'mkdir -p /opt/mbs && tar -xz -C /opt/mbs && chmod +x /opt/mbs/*.sh'

      - name: Deploy
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@${{ secrets.VPS_HOST }}" \
            "/opt/mbs/deploy.sh '${{ steps.tags.outputs.profile }}' \
              '${{ steps.tags.outputs.cms }}' '${{ steps.tags.outputs.api }}'"
