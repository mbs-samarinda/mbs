name: CMS schema

# Its own workflow so that adding or removing the label reruns this check
# alone, not every CI job.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cms-schema:
    name: cms schema
    runs-on: ubuntu-latest
    steps:
      # The checkout is GitHub's merge of the PR into its base, so its first
      # parent is the base as of this run. Depth 2 is enough to reach it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      # scripts/ belongs to no package, so turbo's lint and format jobs never
      # see it.
      - run: pnpm exec oxfmt --check -c .oxfmtrc.json scripts
      - run: pnpm exec oxlint -c .oxlintrc.json scripts
      - run: node --test 'scripts/*.test.ts'
      - name: No CMS schema change drops stored content
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'schema-break-ok') }}
        run: node scripts/check-cms-schema.ts HEAD^1
