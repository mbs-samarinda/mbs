name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mbs
          POSTGRES_PASSWORD: mbs_local_dev
          POSTGRES_DB: mbs_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbs -d mbs_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://mbs:mbs_local_dev@localhost:5432/mbs_core
      # Remote cache credentials. Locally these come from .turbo/config.json,
      # which is gitignored, so CI has to be told separately.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAMID: team_G2sXGIEvkYnFhLHzWtvo1u04

    steps:
      - uses: actions/checkout@v5
        with:
          # --affected diffs against the base branch, which needs real history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The documented gate order. Formatting and linting run before anything
      # slow so a trivial mistake fails in seconds.
      - run: pnpm format:check
      - run: pnpm lint

      # On a pull request only the changed packages and their dependents need
      # checking. A push to main checks everything, because --affected would
      # compare main against itself and find nothing.
      - if: github.event_name == 'pull_request'
        run: pnpm exec turbo run typecheck --affected
      - if: github.event_name != 'pull_request'
        run: pnpm exec turbo run typecheck

      - if: github.event_name == 'pull_request'
        run: pnpm exec turbo run test --affected
      - if: github.event_name != 'pull_request'
        run: pnpm exec turbo run test

      # Migrations run once against the real database before the tests that use
      # it, the same way deployment runs them before starting containers.
      - run: pnpm db:migrate
      - run: pnpm --filter @mbs/api test:integration

      # Builds the applications that produce artifacts. The API has no build
      # step: it runs TypeScript directly on Node, and typecheck above is what
      # proves it compiles.
      - if: github.event_name == 'pull_request'
        run: pnpm exec turbo run build --affected
      - if: github.event_name != 'pull_request'
        run: pnpm exec turbo run build
