# Lefthook's own postinstall writes these into .git/hooks, so a fresh clone
# only needs `pnpm install` before they start firing.

pre-commit:
  # Sequential on purpose: oxfmt rewrites the staged files and oxlint has to
  # read what it wrote. --no-error-on-unmatched-pattern because a commit whose
  # only scripts sit in an ignored folder, such as .claude/, gives each tool no
  # files, which they otherwise treat as a failure.
  commands:
    format:
      priority: 1
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec oxfmt -c .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec oxlint -c .oxlintrc.json --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    conventional:
      # A regex instead of commitlint: two fewer dependencies for the one rule
      # this repository actually follows. Only the subject line is checked, so
      # a body can say anything. Merge, revert and fixup subjects are written
      # by git itself and cannot be reshaped.
      run: |
        head -1 {1} | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(.+\))?!?: .+|^(Merge|Revert|fixup!|squash!) ' || {
          echo "Commit message must be a Conventional Commit, for example:"
          echo "  fix(api): reject an admission without a name"
          exit 1
        }

pre-push:
  # No --affected: a push has no reliable base to diff against. Turbo's cache
  # makes the full run cheap whenever nothing changed. Lint and format run
  # again because pre-commit only checks staged files: a type change can make
  # an untouched file fail a type-aware or import/no-cycle rule, and that would
  # otherwise wait for CI.
  commands:
    verify:
      run: pnpm exec turbo run format:check lint typecheck test
