# Local development only. Production runs its own compose file on the VPS.
services:
  postgres:
    image: postgres:18-alpine
    container_name: mbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbs
      POSTGRES_PASSWORD: mbs_local_dev
      POSTGRES_DB: mbs_core
      # Production passes a real one from /opt/mbs/.env. Written out here rather
      # than defaulted in the script, so a missing value in production fails
      # instead of quietly reusing the development password.
      CMS_DB_PASSWORD: mbs_cms_local_dev
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data in a subdirectory, so the mount is one level up.
      - postgres-data:/var/lib/postgresql
      # Creates the second database with its own owner. The core schema and the
      # CMS schema have separate migration owners, so they get separate roles.
      - ./infra/postgres/init-cms-db.sh:/docker-entrypoint-initdb.d/init-cms-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbs -d mbs_core"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The bucket for receipts and documents. Production uses Biznet's
  # S3-compatible storage; this is the same API on this machine.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mbs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mbs_local_dev
      MINIO_ROOT_PASSWORD: mbs_local_dev_secret
      # The browser PUTs straight to the bucket, so the bucket itself has to
      # allow the two app origins. Production sets the same rule on Biznet.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:5174
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mbs-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 mbs_local_dev mbs_local_dev_secret
      && mc mb --ignore-existing local/mbss-ppdb"

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: mbs-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
