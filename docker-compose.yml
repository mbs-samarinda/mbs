# Local development only. Production runs its own compose file on the VPS.
services:
  postgres:
    image: postgres:18-alpine
    container_name: mbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbs
      POSTGRES_PASSWORD: mbs_local_dev
      POSTGRES_DB: mbs_core
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data in a subdirectory, so the mount is one level up.
      - postgres-data:/var/lib/postgresql
      # Creates the second database with its own owner. The core schema and the
      # CMS schema have separate migration owners, so they get separate roles.
      - ./infra/postgres/init-cms-db.sql:/docker-entrypoint-initdb.d/init-cms-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbs -d mbs_core"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
